# Runs `make check` (format, detekt, lint, unit tests, coverage, no-telemetry, debug build) on
# every push to master and every pull request. All tests run on the JVM (JUnit 5 and
# Robolectric), so no emulator is needed; tests tagged `live` (real network) are excluded by the
# build unless -Plive is passed, and CI never passes it.
#
# The only secret is CODECOV_TOKEN, for the coverage upload. CI builds only the debug APK: release
# APKs are built and published locally (`make publish`) with the release key, which never leaves the
# maintainer's machine.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # The same JDK as Android Studio's bundled one, which builds the app locally.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # compileSdk 37 (build-logic KotlinAndroid.kt) may be newer than the runner's image.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.1.0

      # Caches dependencies and build outputs (written only from master) and validates the
      # Gradle wrapper jar.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: make check
        run: make check

      # `make check` only verifies coverage; this writes the reports, reusing its test results.
      # core:engine and core:data apply Kover so far.
      - name: Coverage reports
        run: ./gradlew :core:engine:koverXmlReport :core:data:koverXmlReportDebug

      - name: Upload core:engine coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: core/engine/build/reports/kover/report.xml
          flags: engine

      - name: Upload core:data coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: core/data/build/reports/kover/reportDebug.xml
          flags: data

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
