// Classes the Compose compiler should treat as stable (compared with equals()).
// Read by the eksoda.android.compose convention plugin.
//
// core:model is a plain JVM module, so Compose cannot see that its types are immutable and
// would redraw every row of a list whenever Paging hands over new objects. Every type there is
// an immutable data class, enum or sealed type without `var` or mutable collections: keep it so.
io.eksoda.core.model.**

// Immutable JDK value types used by those models.
java.math.BigDecimal
java.time.LocalDate
java.time.LocalDateTime
java.time.OffsetDateTime
java.time.ZonedDateTime
java.time.Instant
java.time.YearMonth
java.time.ZoneId
