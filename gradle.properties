org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# AGP 9 only enables unit tests for the debug build type by default, and its Compose Preview task
# then fails to configure for release (seen with "gradlew tasks").
android.onlyEnableUnitTestForTheTestedBuildType=false
